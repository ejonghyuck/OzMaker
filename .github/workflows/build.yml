# Every push and pull request: the plain build (GIF + MP4, no vcpkg) and the self-test.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild OzMaker.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OzNoVcpkg=true /m /nologo /v:minimal

      - name: Self-test
        shell: pwsh
        run: ./tools/ci-selftest.ps1
