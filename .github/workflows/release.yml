# Full build with WebP and AVIF (vcpkg on the runner), self-test, and the distribution zip.
# A v* tag publishes the zip as a GitHub release, with OzMaker.exe and update.txt for the updater (src/Updater.h);
# a manual run or a pull request that touches the encoder build only uploads them as an artifact.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - vcpkg.json
      - triplets/**
      - src/encoders/**
      - OzMaker.vcxproj
      - tools/package.ps1
      - tools/ci-selftest.ps1
      - tools/check-version.ps1
      - src/Updater.*
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The version files must agree, and a tag must name the version its commit carries: a tag pushed on the wrong
      # commit stops here, before anything is built or published.
      - name: Check version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./tools/check-version.ps1 -Tag $tag

      - uses: microsoft/setup-msbuild@v2

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          "commit=$(git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\vcpkg-cache" | Out-Null

      # aom takes a long time to compile; keep vcpkg's built packages between runs.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}
          restore-keys: vcpkg-${{ steps.vcpkg.outputs.commit }}-

      - name: Build
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$env:RUNNER_TEMP\vcpkg-cache"
          msbuild OzMaker.vcxproj /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Self-test
        shell: pwsh
        run: ./tools/ci-selftest.ps1 -Require GIF,WebP,AVIF,WebM

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -NoBuild

      # The app folder, as the zip holds it. GitHub zips an artifact for download, so a zip in it would be packed twice.
      # The release step below takes its files from dist itself.
      - uses: actions/upload-artifact@v4
        with:
          name: OzMaker
          path: dist/OzMaker-*-win-x64/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist\OzMaker-*-win-x64.zip | Select-Object -First 1
          $files = @($zip.FullName, 'dist\OzMaker.exe', 'dist\update.txt')
          # The PDB reads crash reports from this build.
          $pdb = Get-ChildItem dist\OzMaker-*-pdb.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pdb) { $files += $pdb.FullName }
          # --notes is prepended to the generated list of changes.
          $notes = Get-Content .github/release-notes.md -Raw -Encoding utf8
          # The updater reads releases/latest/download/update.txt and then the exe it names.
          gh release create $env:GITHUB_REF_NAME @files --title "OzMaker $env:GITHUB_REF_NAME" --notes $notes --generate-notes
